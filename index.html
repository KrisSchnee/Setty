<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setty</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h1>Setty</h1>
        <a class="credit" href="https://x.ai" target="_blank" rel="noopener">Made with Grok (xAI)</a>
        <div class="modes" role="group" aria-label="Tool">
          <button type="button" id="mode-place" aria-pressed="true">Place <kbd>P</kbd></button>
          <button type="button" id="mode-select" aria-pressed="false">Select <kbd>S</kbd></button>
        </div>
        <button type="button" id="export-still">Export PNG <kbd>E</kbd></button>
        <label class="snap">
          <input id="snap" type="checkbox" checked />
          Snap to grid
        </label>
        <div id="status"></div>
      </header>
      <div id="workspace">
        <canvas id="map"></canvas>
        <aside id="sidebar">
          <div id="preview">
            <canvas id="view3d"></canvas>
          </div>
          <section id="inspector-polygon" class="inspector" hidden>
            <h2>Polygon</h2>
            <label class="field">
              Height (m)
              <input id="height" type="text" inputmode="decimal" autocomplete="off" />
            </label>
            <label class="field">
              Color
              <span class="color-row">
                <input id="poly-color-well" type="color" value="#808080" />
                <input id="poly-color" type="text" spellcheck="false" autocomplete="off" />
              </span>
            </label>
          </section>
          <section id="inspector-camera" class="inspector" hidden>
            <h2>Camera</h2>
            <label class="field">
              Y-axis rotation (°)
              <input id="camera-yaw" type="text" inputmode="numeric" autocomplete="off" title="0° faces +X, increasing counter-clockwise" />
            </label>
            <label class="field">
              Height (m)
              <input id="camera-y" type="text" inputmode="decimal" autocomplete="off" />
            </label>
          </section>
          <section id="inspector-floor" class="inspector" hidden>
            <h2>Floor</h2>
            <label class="field">
              Floor
              <span class="color-row">
                <input id="floor-color-well" type="color" value="#202020" />
                <input id="floor-color" type="text" spellcheck="false" autocomplete="off" />
              </span>
            </label>
            <label class="field">
              Sky
              <span class="color-row">
                <input id="sky-color-well" type="color" value="#00bfff" />
                <input id="sky-color" type="text" spellcheck="false" autocomplete="off" />
              </span>
            </label>
          </section>
        </aside>
      </div>
      <footer>
        <span id="help-place">
          <kbd>Click</kbd> place point
          · <kbd>Enter</kbd> or click first point to close
          · <kbd>Esc</kbd> cancel
        </span>
        <span id="help-select" hidden>
          <kbd>Click</kbd> polygon, camera, or empty floor
          · Drag the yellow camera to move it
          · <kbd>Esc</kbd> deselect
        </span>
        <span><kbd>E</kbd> export 16:9 PNG</span>
        <span><kbd>G</kbd> snap</span>
        <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
        <span>Wheel zoom · Space-drag or middle-drag pan</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
